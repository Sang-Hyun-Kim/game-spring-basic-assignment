# 런타임 DB는 MySQL 하나뿐이다. H2는 테스트(application-test.properties) 전용이다.
# 접속 정보의 원본은 docker/.env 다. 포트를 바꾸면 양쪽을 함께 고친다.
#
# 호스트 포트 3308을 쓰는 이유:
#   3306 = 이 PC의 네이티브 MySQL80 서비스가 점유
#   3307 = 다른 프로젝트의 MySQL 컨테이너가 선점
# 컨테이너 안은 3306 그대로이고, compose 가 3308:3306 으로 매핑한다.

spring.datasource.url=jdbc:mysql://localhost:3308/crimson_citadel
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=root
spring.datasource.password=myPWD0908

# update: 엔티티에 맞춰 테이블을 만들되 기존 데이터는 지우지 않는다.
# create / create-drop 은 재시작할 때마다 테이블을 drop 하므로 저장이 유지되지 않는다.
spring.jpa.hibernate.ddl-auto=update

# 뷰 렌더링 시점까지 영속성 컨텍스트를 열어두지 않는다. 커넥션을 오래 쥐는 것을 막는다.
spring.jpa.open-in-view=false
# 실행되는 SQL을 로그로 확인한다.
spring.jpa.show-sql=true
